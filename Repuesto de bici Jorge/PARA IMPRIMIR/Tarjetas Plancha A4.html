<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plancha de Tarjetas A4 — Repuestos de Bici Jorge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:        #1FB04B;
    --green-deep:   #0E7A33;
    --ink:          #0B1220;
    --ink-2:        #46556A;
    --paper:        #FFFFFF;
    --accent:       #F2664B;   /* coral — foco del QR */
    --accent-deep:  #C84A33;
  }

  /* A4 portrait con margen automático para zona segura. */
  @page{
    size: A4 portrait;
    margin: 10mm;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body{ background:#2a2a2a; font-family:'Plus Jakarta Sans', system-ui, sans-serif; color:var(--ink); }
  body{ display:flex; flex-direction:column; align-items:center; gap:24px; padding:24px; }

  .label{
    color:#aab2ba; font-weight:700; font-size:13px; letter-spacing:.2em;
    text-transform:uppercase;
  }

  /* Hoja: en pantalla simula A4 con sombra; en print no agrega nada. */
  .sheet{
    width: 190mm;
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .grid{
    width: 190mm;
    display: grid;
    grid-template-columns: 95mm 95mm;
    grid-template-rows: repeat(5, 52mm);
    gap: 0;
  }

  /* ============ CARDS — TODO EN MM, sin scale ni transform ============ */

  .card{
    width: 95mm;
    height: 52mm;
    outline: 0.15mm dashed rgba(0,0,0,.4);
    outline-offset: -0.075mm;
    overflow: hidden;
    background: var(--paper);
    position: relative;
  }

  /* ----- FRENTE ----- */
  .card.front{
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .card.front .left{
    background: var(--green);
    color: #fff;
    padding: 4mm 3mm;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; gap: 1.4mm;
  }
  .card.front .emblem svg{ width: 10mm; height: 10mm; display:block; border: 0.5mm solid #fff; border-radius: 50%; padding: 2.2mm; box-sizing: border-box; }
  .card.front .lede{
    font-weight: 900;
    font-size: 5.8mm;
    line-height: .9;
    letter-spacing: -.04em;
    word-spacing: .18em;
    text-transform: uppercase;
  }
  .card.front .lede span{ display:block; }
  .card.front .sig{
    display: flex; align-items: center; justify-content: center; gap: 1.2mm;
    font-weight: 700;
    font-size: 2.3mm;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-top: 0.4mm;
  }
  .card.front .sig::before, .card.front .sig::after{
    content:""; width: 2.5mm; height: 0.3mm;
    background:#fff; opacity:.85; border-radius: 0.2mm;
  }
  .card.front .sig b{ font-weight: 900; letter-spacing: -.01em; }

  .card.front .right{
    padding: 3mm 3mm;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 1.5mm;
    background: #fff;
  }
  .card.front .qr{
    width: 32mm; height: 32mm;
    background: #fff;
    border-radius: 1.8mm;
    padding: 1.2mm;
    box-shadow: 0 0 0 0.5mm var(--accent);
  }
  .card.front .qr img{ display:block; width:100%; height:100%; }
  .card.front .scan{
    font-weight: 800;
    font-size: 2.4mm;
    color: var(--accent-deep);
    letter-spacing: -.01em;
    line-height: 1;
  }
  .card.front .scan .arrow{ display:inline-block; transform: translateY(0.2mm); margin-right: 0.5mm; }

  /* ----- DORSO ----- */
  .card.back{
    padding: 3.6mm 4.4mm;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card.back .head{ display: flex; align-items: center; gap: 2mm; }
  .card.back .head svg{ width: 6mm; height: 6mm; color: var(--green); }
  .card.back .head .name{
    font-weight: 900;
    font-size: 3.8mm;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .card.back .head .name small{
    display: block;
    font-weight: 700;
    font-size: 1.7mm;
    color: var(--ink-2);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-top: 0.5mm;
  }
  .card.back .cats{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1mm 2.4mm;
  }
  .card.back .cats .item{
    display: flex; align-items: center; gap: 1mm;
    font-weight: 700;
    font-size: 2mm;
    color: var(--ink);
    letter-spacing: -.01em;
    line-height: 1;
    white-space: nowrap;
  }
  .card.back .cats .item .dot{
    flex: 0 0 auto;
    width: 1.8mm; height: 1.8mm;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .card.back .cats .item .dot svg{
    width: 1mm; height: 1mm;
    stroke:#fff; stroke-width:3.5; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .card.back .phone{
    display: flex; align-items: center; gap: 2.2mm;
    background: var(--green);
    color: #fff;
    padding: 2mm 2.8mm;
    border-radius: 2.2mm;
  }
  .card.back .phone .ico{
    width: 6mm; height: 6mm;
    background: #fff;
    color: var(--green);
    border-radius: 1.4mm;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .card.back .phone .ico svg{ width: 4.2mm; height: 4.2mm; }
  .card.back .phone .num{
    font-weight: 900;
    font-size: 4.6mm;
    line-height: 1;
    letter-spacing: -.02em;
    white-space: nowrap;
  }
  .card.back .meta{
    display: flex; flex-direction: column; gap: 0.9mm;
    font-weight: 800;
    font-size: 2.2mm;
    color: var(--ink-2);
    letter-spacing: -.005em;
  }
  .card.back .meta .line{ display: flex; align-items: center; gap: 1.3mm; }
  .card.back .meta .pin{
    flex: 0 0 auto;
    width: 2.2mm; height: 2.2mm;
    position: relative;
  }
  .card.back .meta .pin::before{
    content:""; position:absolute; left:50%; top:0;
    width: 1.7mm; height: 1.7mm;
    background: var(--ink-2);
    border-radius: 50% 50% 50% 0;
    transform: translateX(-50%) rotate(-45deg);
  }
  .card.back .meta .pin::after{
    content:""; position:absolute; left:50%; top:0.6mm;
    width: 0.6mm; height: 0.6mm;
    background:#fff; border-radius:50%;
    transform: translateX(-50%);
  }
  .card.back .meta .clock{
    width: 2.4mm; height: 2.4mm;
    border: 0.4mm solid var(--ink-2);
    border-radius: 50%;
    position: relative;
  }
  .card.back .meta .clock::before,
  .card.back .meta .clock::after{
    content:""; position:absolute; left:50%; top:50%;
    background: var(--ink-2); border-radius: 0.1mm;
  }
  .card.back .meta .clock::before{ width: 0.3mm; height: 0.8mm; transform: translate(-50%,-100%); }
  .card.back .meta .clock::after { width: 0.7mm; height: 0.3mm; transform: translate(-10%,-50%); }

  /* ---------- PRINT ---------- */
  @media print{
    html, body{ background:#fff; margin:0 !important; padding:0 !important; gap:0 !important; }
    body{ display: block; }
    .label{ display: none !important; }
    .sheet{
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .sheet:last-of-type{ page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>

  <div class="label">Plancha A4 — 10 frentes (página 1)</div>
  <div class="sheet">
    <div class="grid" id="grid-front"></div>
  </div>

  <div class="label">Plancha A4 — 10 dorsos (página 2)</div>
  <div class="sheet">
    <div class="grid" id="grid-back"></div>
  </div>

  <!-- ============ TEMPLATES ============ -->
  <template id="tpl-front">
    <div class="card front">
      <div class="left">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="-1.5 -1.5 27 27" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible">
            <circle cx="18.5" cy="17.5" r="3.5"/>
            <circle cx="5.5" cy="17.5" r="3.5"/>
            <circle cx="15" cy="5" r="1" fill="#fff"/>
            <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
          </svg>
        </div>
        <div class="lede"><span>Repuestos</span><span>de Bici</span></div>
        <div class="sig"><b>Jorge</b></div>
      </div>
      <div class="right">
        <div class="qr"><img src="qr-catalogo.png" alt="QR catálogo"></div>
        <div class="scan"><span class="arrow">←</span> Escaneá el catálogo</div>
      </div>
    </div>
  </template>

  <template id="tpl-back">
    <div class="card back">
      <div class="head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18.5" cy="17.5" r="3.5"/>
          <circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="15" cy="5" r="1" fill="currentColor"/>
          <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
        </svg>
        <div class="name">Jorge<small>Repuestos de Bici</small></div>
      </div>

      <div class="cats">
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Cubiertas y cámaras</div>
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Parches y pegamentos</div>
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Frenos y cadenas</div>
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Asientos y manubrios</div>
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Infladores y herramientas</div>
        <div class="item"><span class="dot"><svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg></span>Aceite, grasa y luces</div>
      </div>
      <div class="phone">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="currentColor">
            <path d="M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.043-.53-.043-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015.99.472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34.616.287 2.035.888 2.722.888.817 0 2.15-.515 2.478-1.318.13-.33.27-.66.27-1.006 0-.244-.058-.36-.226-.474-.255-.135-2.105-1.097-2.504-1.097zm-2.49 7.39h-.014c-1.857 0-3.59-.545-5.082-1.46l-3.552 1.132 1.16-3.435a8.992 8.992 0 0 1-1.74-5.323c0-4.997 4.13-9.073 9.234-9.073 2.483 0 4.812.946 6.562 2.665a8.853 8.853 0 0 1 2.715 6.408c-.002 4.992-4.13 9.085-9.282 9.085zM16.62 5C10.55 5 5.61 9.832 5.61 15.776A10.61 10.61 0 0 0 7.083 21.2L5 27.286l6.367-2.027c1.6.86 3.4 1.318 5.236 1.318h.014c6.067 0 11.092-4.832 11.092-10.778 0-2.882-1.156-5.59-3.252-7.624A11.094 11.094 0 0 0 16.622 5z"/>
          </svg>
        </span>
        <span class="num">11 5476-7247</span>
      </div>
      <div class="meta">
        <div class="line"><span class="clock"></span>Lun a Sáb · 9 a 18 hs</div>
        <div class="line"><span class="pin"></span>Siria 6110, Virrey del Pino</div>
      </div>
    </div>
  </template>

<script>
  const tplFront = document.getElementById('tpl-front');
  const tplBack  = document.getElementById('tpl-back');
  const gridFront = document.getElementById('grid-front');
  const gridBack  = document.getElementById('grid-back');
  for (let i = 0; i < 10; i++){
    gridFront.appendChild(tplFront.content.cloneNode(true));
    gridBack.appendChild(tplBack.content.cloneNode(true));
  }
</script>

<!--
  Plancha A4 — 10 tarjetas por hoja, 95×52mm c/u.
  Diálogo de impresión: A4, Márgenes "Predeterminados", Gráficos de fondo ACTIVADO.
  Página 1 = 10 frentes · Página 2 = 10 dorsos. Imprimí a doble cara.
-->

<script>
  (async function(){
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const qrs = document.querySelectorAll('.card.front .qr img');
      await Promise.all(Array.from(qrs).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(res => {
          img.addEventListener('load', res, { once: true });
          img.addEventListener('error', res, { once: true });
        });
      }));
      await new Promise(r => setTimeout(r, 500));
      window.print();
    } catch(e) {
      console.warn('autoprint:', e);
      window.print();
    }
  })();
</script>

</body>
</html>
