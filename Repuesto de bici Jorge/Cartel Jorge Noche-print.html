<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartel — Repuestos de Bici Jorge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Versión NOCHE — azul-noche cálido + verde WhatsApp + crema */
    --green:        #1FB04B;   /* mantiene la marca WhatsApp */
    --green-deep:   #0E7A33;   /* verde profundo sobre crema */
    --green-soft:   #F0E5D3;   /* "luz" cálida tipo papel, hace que el QR brille */
    --ink:          #F2E9D8;   /* texto crema cálido (no blanco puro) */
    --ink-2:        #A8B5C0;   /* texto secundario gris frío */
    --paper:        #13202C;   /* fondo principal: azul-noche cálido */
    --card:         #1F303D;   /* tarjetas: un escalón más claro */
  }

  /* ----- PRINT PAGE — ancho 85 cm; el alto se ajusta al contenido ----- */
  @page{
    size: 850mm 2125mm;
    margin: 0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body{ background:#1a1a1a; font-family:'Plus Jakarta Sans', system-ui, sans-serif; color:var(--ink); }
  body{ display:flex; justify-content:center; padding:40px 20px; }

  /* ---------- BANNER ----------
     Diseño 1200 px de ancho en pantalla. Altura definida por el contenido.
     Imprime sin pérdida (todo vectorial). */
  .banner{
    width: 1200px;
    background: var(--paper);
    border-radius: 56px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }

  /* ---------- HEADER ---------- */
  .header{
    position: relative;
    background: var(--green);
    color: #fff;
    text-align: center;
    padding: 50px 60px 36px;
    overflow: hidden;
  }

  .header .emblem{
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }
  .header .emblem svg{
    width: 270px;
    height: 270px;
    border: 9px solid #fff;
    border-radius: 50%;
    padding: 58px;
    box-sizing: border-box;
  }

  .header .lede{
    font-weight: 900;
    font-size: 156px;
    line-height: .92;
    letter-spacing: -.045em;
    word-spacing: .2em;
    text-transform: uppercase;
  }
  .header .lede span{ display: block; }

  .header .sig{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-top: 30px;
    font-weight: 700;
    font-size: 56px;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .header .sig::before, .header .sig::after{
    content: "";
    flex: 0 0 90px;
    height: 5px;
    background: #fff;
    border-radius: 3px;
    opacity: .85;
  }
  .header .sig b{ font-weight: 900; letter-spacing: -.01em; }

  .header .meta-row{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 22px;
    margin-top: 30px;
  }
  .header .hours, .header .zone{
    display:inline-flex; align-items:center; gap:18px;
    padding: 16px 32px;
    background: rgba(255,255,255,.16);
    border: 3px solid rgba(255,255,255,.55);
    border-radius: 999px;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .header .zone .pin{
    flex: 0 0 auto;
    width: 34px; height: 38px;
    position: relative;
  }
  .header .zone .pin::before{
    content:""; position:absolute; left:50%; top:0;
    width: 30px; height: 30px;
    background:#fff;
    border-radius: 50% 50% 50% 0;
    transform: translateX(-50%) rotate(-45deg);
  }
  .header .zone .pin::after{
    content:""; position:absolute; left:50%; top:9px;
    width: 11px; height: 11px;
    background: var(--green);
    border-radius:50%;
    transform: translateX(-50%);
  }
  .header .hours .clock{
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 4px solid #fff;
    position: relative;
  }
  .header .hours .clock::before,
  .header .hours .clock::after{
    content:""; position:absolute; left:50%; top:50%;
    background:#fff; border-radius:2px;
  }
  .header .hours .clock::before{ width:3px; height:11px; transform:translate(-50%,-100%); }
  .header .hours .clock::after { width:9px;  height:3px; transform:translate(-10%,-50%); }

  /* ---------- TITULO ---------- */
  .section-title{
    text-align: center;
    padding: 56px 60px 0;
    font-weight: 800;
    font-size: 96px;
    line-height: 1;
    letter-spacing: -.03em;
  }
  .section-title .q{ color: var(--green); }

  /* ---------- STEPS ---------- */
  .steps{
    padding: 40px 60px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .step{
    background: var(--card);
    border-radius: 32px;
    padding: 30px 44px;
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .step .num{
    flex: 0 0 auto;
    width: 110px; height: 110px;
    border-radius: 28px;
    background: var(--green);
    color: #fff;
    font-weight: 900;
    font-size: 80px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: -.04em;
  }
  .step .body{ flex:1; min-width:0; }
  .step h3{
    font-weight: 800;
    font-size: 60px;
    line-height: 1.05;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .step p{
    margin-top: 10px;
    font-weight: 600;
    font-size: 36px;
    line-height: 1.25;
    color: var(--ink-2);
  }

  /* ---------- QR BLOCK ---------- */
  .qr-block{
    background: var(--green-soft);
    padding: 40px 60px 44px;
    text-align: center;
    border-top: 6px solid var(--green);
  }
  .qr-eyebrow{
    font-weight: 900;
    font-size: 62px;
    letter-spacing: -.015em;
    color: var(--green-deep);
    line-height: 1.02;
  }
  .qr-eyebrow .arrow{ display:inline-block; transform: translateY(6px); margin-right: 8px; }
  .qr-card{
    margin: 32px auto 0;
    width: 920px; max-width: 100%;
    background: #fff;
    border-radius: 40px;
    padding: 40px;
    box-shadow: 0 0 0 8px var(--green);
  }
  .qr-card svg, .qr-card img{
    display: block;
    width: 100% !important;
    height: auto !important;
  }
  .qr-foot{
    margin-top: 28px;
    font-weight: 800;
    font-size: 34px;
    color: var(--green-deep);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* ---------- WHATSAPP CTA ---------- */
  .wa-cta{
    margin: 28px 60px 36px;
    background: var(--green);
    border-radius: 36px;
    padding: 34px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    color: #fff;
    text-decoration: none;
  }
  .wa-cta .icon{
    width: 130px; height: 130px;
    flex: 0 0 auto;
    background: #fff;
    color: var(--green);
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .wa-cta .icon svg{ width: 92px; height: 92px; }
  .wa-cta .num{
    font-weight: 900;
    font-size: 100px;
    line-height: 1;
    letter-spacing: -.02em;
    white-space: nowrap;
  }

  /* ---------- PRINT ---------- */
  /* ---------- PRINT ----------
     Página 850×2125 mm. Body con zoom para escalar el contenido
     (diseñado en px para 1200 px de ancho) al tamaño físico final. */
  @media print{
    html, body{ background:#fff; margin:0; padding:0; }
    body{
      display: block;
      zoom: 2.677;          /* 850mm / (1200px * 1/96in) = 2.677 */
    }
    .banner{
      width: 1200px;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

  <div class="banner" id="banner">

    <!-- HEADER -->
    <header class="header">
      <!-- Emblema: bici como pictograma billboard -->
      <div class="emblem" aria-hidden="true">
        <svg viewBox="-1.5 -1.5 27 27" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible">
          <circle cx="18.5" cy="17.5" r="3.5"/>
          <circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="15" cy="5" r="1" fill="#fff"/>
          <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
        </svg>
      </div>

      <h1 class="lede">
        <span>Repuestos</span>
        <span>de Bici</span>
      </h1>

      <div class="sig"><b>Jorge</b></div>

      <div class="meta-row">
        <div class="hours">
          <span class="clock"></span>
          Lun a Sáb · 9 a 18 hs
        </div>
      </div>
    </header>

    <!-- TITULO -->
    <h2 class="section-title">¿Cómo <span class="q">funciona?</span></h2>

    <!-- PASOS -->
    <section class="steps">
      <article class="step">
        <div class="num">1</div>
        <div class="body">
          <h3>Escaneá el QR</h3>
          <p>Apuntá la cámara del celular.</p>
        </div>
      </article>
      <article class="step">
        <div class="num">2</div>
        <div class="body">
          <h3>Elegí el repuesto</h3>
          <p>Mirá el catálogo.</p>
        </div>
      </article>
      <article class="step">
        <div class="num">3</div>
        <div class="body">
          <h3>Consultá por WhatsApp</h3>
          <p>Jorge te responde al toque.</p>
        </div>
      </article>
    </section>

    <!-- QR -->
    <section class="qr-block">
      <div class="qr-eyebrow"><span class="arrow">▼</span> Escaneá acá</div>
      <div class="qr-card">
        <img id="qr" alt="Código QR — catálogo de Repuestos de Bici Jorge"
             src="qr-catalogo.png">
      </div>
      <div class="qr-foot">Catálogo online</div>
    </section>

    <!-- WHATSAPP DIRECTO -->
    <a class="wa-cta" href="https://wa.me/5491154767247">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor">
          <path d="M19.11 17.205c-.372 0-1.088 1.39-1.518 1.39a.63.63 0 0 1-.315-.1c-.802-.402-1.504-.817-2.163-1.447-.545-.516-1.146-1.29-1.46-1.963a.426.426 0 0 1-.073-.215c0-.33.99-.945.99-1.49 0-.143-.73-2.09-.832-2.335-.143-.372-.214-.487-.6-.487-.187 0-.36-.043-.53-.043-.302 0-.53.115-.746.315-.688.645-1.032 1.318-1.06 2.264v.114c-.015.99.472 1.977 1.017 2.78 1.23 1.82 2.506 3.41 4.554 4.34.616.287 2.035.888 2.722.888.817 0 2.15-.515 2.478-1.318.13-.33.27-.66.27-1.006 0-.244-.058-.36-.226-.474-.255-.135-2.105-1.097-2.504-1.097zm-2.49 7.39h-.014c-1.857 0-3.59-.545-5.082-1.46l-3.552 1.132 1.16-3.435a8.992 8.992 0 0 1-1.74-5.323c0-4.997 4.13-9.073 9.234-9.073 2.483 0 4.812.946 6.562 2.665a8.853 8.853 0 0 1 2.715 6.408c-.002 4.992-4.13 9.085-9.282 9.085zM16.62 5C10.55 5 5.61 9.832 5.61 15.776A10.61 10.61 0 0 0 7.083 21.2L5 27.286l6.367-2.027c1.6.86 3.4 1.318 5.236 1.318h.014c6.067 0 11.092-4.832 11.092-10.778 0-2.882-1.156-5.59-3.252-7.624A11.094 11.094 0 0 0 16.622 5z"/>
        </svg>
      </span>
      <span class="num">11 5476-7247</span>
    </a>

  </div>

<!--
  PARA IMPRENTA — versión NOCHE:
  - Tamaño físico: 850 mm de ancho × ~210 cm de alto (medido dinámicamente).
  - Imprimí con "Gráficos de fondo" activado para que salga el fondo azul-noche.
-->

<script>
  // Auto-print: mide el alto real del cartel y setea @page exacto, así entra en 1 hoja.
  (async function(){
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      const qr = document.getElementById('qr');
      if (qr && !qr.complete) {
        await new Promise(res => {
          qr.addEventListener('load', res, { once: true });
          qr.addEventListener('error', res, { once: true });
        });
      }
      await new Promise(r => setTimeout(r, 300));

      const banner = document.querySelector('.banner');
      const rect = banner.getBoundingClientRect();
      const ZOOM = 2.677;
      const PX_TO_MM = 25.4 / 96;
      const widthMm  = rect.width  * ZOOM * PX_TO_MM;
      const heightMm = rect.height * ZOOM * PX_TO_MM;

      const style = document.createElement('style');
      style.textContent =
        '@page { size: ' + widthMm.toFixed(2) + 'mm ' + heightMm.toFixed(2) + 'mm; margin: 0; }';
      document.head.appendChild(style);

      console.log('[Cartel Noche] Tamaño imprenta:',
        widthMm.toFixed(0) + ' mm × ' + heightMm.toFixed(0) + ' mm');

      await new Promise(r => setTimeout(r, 200));
      window.print();
    } catch(e) {
      console.warn('autoprint:', e);
      window.print();
    }
  })();
</script>
</body>
</html>
